<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <!-- TOP BAR / HEADER -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">🛒 POS Order System</h1>
        <div id="sync-status" class="text-sm bg-blue-700 px-3 py-1 rounded-full">
            📊 Sheet Sync: Ready
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="container mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- LEFT/CENTER: PRODUCT SELECTION & CART -->
        <div class="md:col-span-2 space-y-6">
            
            <!-- ORDER DETAILS INPUT -->
            <div class="bg-white p-4 rounded-lg shadow space-y-4">
                <h2 class="font-semibold text-lg border-b pb-2">1. Order Details</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Table / Customer Reference</label>
                        <input type="text" id="order-table" placeholder="e.g. Table 5 / Juan" class="mt-1 w-full p-2 border rounded-md focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Payment Method</label>
                        <select id="payment-method" class="mt-1 w-full p-2 border rounded-md focus:ring-blue-500 focus:border-blue-500">
                            <option value="Cash">Cash</option>
                            <option value="GCash">GCash</option>
                            <option value="Maya">Maya</option>
                            <option value="Card">Card</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- ADD ITEM FORM -->
            <div class="bg-white p-4 rounded-lg shadow space-y-4">
                <h2 class="font-semibold text-lg border-b pb-2">2. Add Item to Cart</h2>
                <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                    <div class="sm:col-span-2">
                        <label class="block text-sm font-medium text-gray-700">Item Name</label>
                        <input type="text" id="item-name" placeholder="e.g. Burger" class="mt-1 w-full p-2 border rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Price (₱)</label>
                        <input type="number" id="item-price" placeholder="0.00" step="0.01" class="mt-1 w-full p-2 border rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Qty</label>
                        <input type="number" id="item-qty" value="1" min="1" class="mt-1 w-full p-2 border rounded-md">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Order Type</label>
                    <select id="item-ordertype" class="mt-1 w-full p-2 border rounded-md">
                        <option value="Dine-In">Dine-In</option>
                        <option value="Take-Out">Take-Out</option>
                    </select>
                </div>
                <button onclick="addToCart()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md transition">
                    ➕ Add to Cart
                </button>
            </div>

            <!-- CURRENT CART -->
            <div class="bg-white p-4 rounded-lg shadow space-y-4">
                <h2 class="font-semibold text-lg border-b pb-2">3. Current Cart</h2>
                <div id="cart-list" class="divide-y divide-gray-200">
                    <p class="text-gray-500 text-center py-4">Cart is empty.</p>
                </div>

                <div class="border-t pt-4 space-y-2">
                    <div class="flex justify-between text-lg font-bold">
                        <span>Total Amount:</span>
                        <span id="cart-total">₱0.00</span>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Amount Paid (₱)</label>
                        <input type="number" id="amount-paid" placeholder="0.00" step="0.01" oninput="calculateChange()" class="mt-1 w-full p-2 border rounded-md text-lg font-semibold">
                    </div>
                    <div class="flex justify-between text-md font-semibold text-gray-700">
                        <span> Sukli / Change:</span>
                        <span id="calculated-change" class="text-green-600">₱0.00</span>
                    </div>
                </div>

                <button id="pay-button" onclick="checkout()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-md text-lg transition shadow">
                    💳 Pay & Complete
                </button>
            </div>
        </div>

        <!-- RIGHT: RECENT ORDERS HISTORY -->
        <div class="bg-white p-4 rounded-lg shadow space-y-4 h-fit">
            <h2 class="font-semibold text-lg border-b pb-2">📜 Order History</h2>
            <div id="order-history-list" class="space-y-3 max-h-[600px] overflow-y-auto">
                <p class="text-gray-500 text-sm text-center py-4">No completed orders yet.</p>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // 1. YOUR GOOGLE APPS SCRIPT EXEC WEB APP URL
        const GOOGLE_SHEET_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwdZhsm9d7_h-oRUZuavAZYLUdgKh_MeyOxle1ZRzah0iTuwZKOnlbYd0eNi-aA7adjxA/exec";

        let cart = [];
        let orderHistory = [];
        let orderCounter = 1;

        // Badge Generator
        function getTypeBadgeHtml(type) {
            if (type === 'Take-Out') {
                return `<span class="bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded-full font-medium">Take-Out</span>`;
            }
            return `<span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-0.5 rounded-full font-medium">Dine-In</span>`;
        }

        // Add Item
        function addToCart() {
            const nameInput = document.getElementById('item-name');
            const priceInput = document.getElementById('item-price');
            const qtyInput = document.getElementById('item-qty');
            const typeInput = document.getElementById('item-ordertype');

            const name = nameInput.value.trim();
            const price = parseFloat(priceInput.value);
            const qty = parseInt(qtyInput.value) || 1;
            const orderType = typeInput.value;

            if (!name || isNaN(price) || price <= 0) {
                alert("Please enter a valid item name and price!");
                return;
            }

            cart.push({ name, price, qty, orderType });

            // Clear inputs
            nameInput.value = '';
            priceInput.value = '';
            qtyInput.value = '1';

            renderCart();
        }

        // Remove Item
        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        // Render Cart
        function renderCart() {
            const list = document.getElementById('cart-list');
            const totalElem = document.getElementById('cart-total');

            if (cart.length === 0) {
                list.innerHTML = `<p class="text-gray-500 text-center py-4">Cart is empty.</p>`;
                totalElem.innerText = '₱0.00';
                calculateChange();
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach((item, i) => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                html += `
                    <div class="py-2 flex justify-between items-center">
                        <div>
                            <div class="font-medium">${item.name} x${item.qty} ${getTypeBadgeHtml(item.orderType)}</div>
                            <div class="text-xs text-gray-500">₱${item.price.toFixed(2)} each</div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-bold">₱${subtotal.toFixed(2)}</span>
                            <button onclick="removeFromCart(${i})" class="text-red-500 hover:text-red-700 text-sm font-semibold">✕</button>
                        </div>
                    </div>
                `;
            });

            list.innerHTML = html;
            totalElem.innerText = `₱${total.toFixed(2)}`;
            calculateChange();
        }

        // Clear Cart
        function clearCart() {
            cart = [];
            document.getElementById('amount-paid').value = '';
            renderCart();
        }

        // Calculate Change
        function calculateChange() {
            const orderTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const amountPaid = parseFloat(document.getElementById('amount-paid').value) || 0;
            const changeElem = document.getElementById('calculated-change');

            if (amountPaid >= orderTotal && orderTotal > 0) {
                const change = amountPaid - orderTotal;
                changeElem.innerText = `₱${change.toFixed(2)}`;
            } else {
                changeElem.innerText = `₱0.00`;
            }
        }

        // Render Local History
        function renderOrdersTable() {
            const historyList = document.getElementById('order-history-list');

            if (orderHistory.length === 0) {
                historyList.innerHTML = `<p class="text-gray-500 text-sm text-center py-4">No completed orders yet.</p>`;
                return;
            }

            let html = '';
            orderHistory.forEach(ord => {
                html += `
                    <div class="border rounded-md p-3 bg-gray-50 text-sm space-y-1">
                        <div class="flex justify-between font-bold text-gray-800">
                            <span>${ord.orderId} (${ord.customer})</span>
                            <span class="text-green-600">₱${ord.total.toFixed(2)}</span>
                        </div>
                        <div class="text-xs text-gray-500">${ord.dateTime}</div>
                        <div class="text-xs pt-1 border-t">${ord.itemsHtml}</div>
                    </div>
                `;
            });

            historyList.innerHTML = html;
        }

        // CHECKOUT & GOOGLE SHEETS SYNC (100% RELIABLE GET METHOD)
        async function checkout() {
            if (cart.length === 0) {
                alert("Please add items to cart first!");
                return;
            }

            const payBtn = document.getElementById('pay-button');
            const syncStatus = document.getElementById('sync-status');
            const tableCustomer = document.getElementById('order-table').value || "Dine-In";
            const paymentMethod = document.getElementById('payment-method').value || "Cash";
            
            const orderTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const amountPaid = parseFloat(document.getElementById('amount-paid').value) || orderTotal;
            const change = amountPaid >= orderTotal ? amountPaid - orderTotal : 0;

            payBtn.disabled = true;
            payBtn.innerText = "Processing...";
            syncStatus.innerText = "⏳ Syncing to Sheet...";

            const plainSheetSummary = cart.map(i => `${i.name} x${i.qty} [${i.orderType || 'Dine-In'}]`).join(', ');

            const htmlHistorySummary = cart.map(i => `
                <span class="inline-flex items-center gap-1 my-0.5">
                    <strong>${i.name}</strong> x${i.qty} ${getTypeBadgeHtml(i.orderType || 'Dine-In')}
                </span>
            `).join(', ');

            const currentNum = "#" + orderCounter++;

            // Local History Update
            orderHistory.unshift({
                orderId: currentNum,
                customer: tableCustomer,
                dateTime: new Date().toLocaleString(),
                itemsHtml: htmlHistorySummary,
                total: orderTotal
            });
            renderOrdersTable();

            // Local Computer Exact Time
            const exactLocalTime = new Date().toLocaleString();

            // URL Parameters for GET Request
            const queryParams = new URLSearchParams({
                datetime: exactLocalTime,
                ordernum: currentNum,
                items: `${plainSheetSummary} (${tableCustomer})`,
                paymethod: paymentMethod,
                total: orderTotal.toFixed(2),
                paid: amountPaid.toFixed(2),
                change: change.toFixed(2),
                status: "Paid"
            }).toString();

            try {
                // Send via GET method
                await fetch(`${GOOGLE_SHEET_SCRIPT_URL}?${queryParams}`, {
                    method: 'GET',
                    mode: 'no-cors'
                });
                syncStatus.innerText = "📊 Sheet Sync: Updated ✅";
            } catch (err) {
                console.error("Sync Error:", err);
                syncStatus.innerText = "❌ Sheet Sync: Failed";
            }

            alert(`Order ${currentNum} completed!\nTotal: ₱${orderTotal.toFixed(2)}\nAmount Paid: ₱${amountPaid.toFixed(2)}\nChange: ₱${change.toFixed(2)}`);
            clearCart();
            payBtn.disabled = false;
            payBtn.innerText = "💳 Pay & Complete";
        }
    </script>
</body>
</html>
